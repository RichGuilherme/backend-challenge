name: wagering

x-app-environment: &app-environment
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-wagering}
  DB_USER: ${DB_USER:-wagering}
  DB_PASSWORD: ${DB_PASSWORD:-wagering}
  DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SNS_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:wager-events.fifo
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
  OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-500}
  OUTBOX_RETRY_BASE_MS: ${OUTBOX_RETRY_BASE_MS:-1000}
  OUTBOX_RETRY_CAP_MS: ${OUTBOX_RETRY_CAP_MS:-300000}
  PENDING_REFERENCE_POLL_INTERVAL_MS: ${PENDING_REFERENCE_POLL_INTERVAL_MS:-1000}
  PENDING_REFERENCE_TTL_MS: ${PENDING_REFERENCE_TTL_MS:-86400000}
  PENDING_REFERENCE_RETRY_BASE_MS: ${PENDING_REFERENCE_RETRY_BASE_MS:-2000}
  PENDING_REFERENCE_RETRY_CAP_MS: ${PENDING_REFERENCE_RETRY_CAP_MS:-600000}
  SQS_QUEUE_NAME: wager-transactions.fifo
  SQS_DLQ_NAME: wager-transactions-dlq.fifo
  SQS_CONSUMER_BATCH_SIZE: ${SQS_CONSUMER_BATCH_SIZE:-10}
  SQS_CONSUMER_WAIT_SECONDS: ${SQS_CONSUMER_WAIT_SECONDS:-1}
  SQS_RETRY_BASE_MS: ${SQS_RETRY_BASE_MS:-1000}
  SQS_RETRY_CAP_MS: ${SQS_RETRY_CAP_MS:-60000}
  SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-2000}
  OPS_PORT: 9100

x-app-service: &app-service
  build:
    context: .
    dockerfile: docker/Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-wagering}
      POSTGRES_USER: ${DB_USER:-wagering}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wagering}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.14
    environment:
      SERVICES: sqs,sns
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sns list-subscriptions --query Subscriptions[].SubscriptionArn --output text | grep -q arn:aws:sns"]
      interval: 2s
      timeout: 5s
      retries: 60

  migrate:
    <<: *app-service
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "run", "src/main/migrate.ts", "up"]
    restart: "no"
    environment:
      <<: *app-environment
      SERVICE_NAME: migrate

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./docker/keycloak/wagering-realm.json:/opt/keycloak/data/import/wagering-realm.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q UP <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 40

  app:
    <<: *app-service
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      <<: *app-environment
      SERVICE_NAME: api
      PORT: 3000
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_ISSUER: http://localhost:${KEYCLOAK_PORT:-8081}/realms/wagering
      AUTH_JWKS_URI: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      AUTH_AUDIENCE: wagering-api
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "${APP_PORT:-3000}:3000"

  outbox-publisher:
    <<: *app-service
    command: ["bun", "run", "src/main/main.ts", "outbox-publisher"]
    environment:
      <<: *app-environment
      SERVICE_NAME: outbox-publisher
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:9100/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  reference-worker:
    <<: *app-service
    command: ["bun", "run", "src/main/main.ts", "reference-worker"]
    environment:
      <<: *app-environment
      SERVICE_NAME: reference-worker
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:9100/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  consumer:
    <<: *app-service
    command: ["bun", "run", "src/main/main.ts", "consumer"]
    environment:
      <<: *app-environment
      SERVICE_NAME: consumer
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:9100/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
