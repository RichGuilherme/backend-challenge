name: wagering

x-app-environment: &app-environment
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-wagering}
  DB_USER: ${DB_USER:-wagering}
  DB_PASSWORD: ${DB_PASSWORD:-wagering}
  DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SNS_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:wager-events.fifo
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
  OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-500}
  OUTBOX_RETRY_BASE_MS: ${OUTBOX_RETRY_BASE_MS:-1000}
  OUTBOX_RETRY_CAP_MS: ${OUTBOX_RETRY_CAP_MS:-300000}

x-app-service: &app-service
  build:
    context: .
    dockerfile: docker/Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-wagering}
      POSTGRES_USER: ${DB_USER:-wagering}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wagering}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.14
    environment:
      SERVICES: sqs,sns
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-events-subscriber.fifo >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 60

  app:
    <<: *app-service
    environment:
      <<: *app-environment
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"

  outbox-publisher:
    <<: *app-service
    command: ["bun", "run", "src/main/outbox-publisher.ts"]
    environment:
      <<: *app-environment

volumes:
  postgres-data:
